<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌詞年齢分析AI - Lyrics Age Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <!-- MarkdownをHTMLに変換するライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 歌詞年齢分析AI</h1>
            <p>その歌詞、精神年齢は何歳？ 4つの視点で徹底分析。</p>
        </header>

        <section class="settings-panel">
            <div class="input-group">
                <label for="api-key">Gemini API Key <a href="https://aistudio.google.com/app/apikey" target="_blank" class="small-link">(取得はこちら)</a></label>
                <input type="password" id="api-key" placeholder="AIzaSy..." required>
            </div>
            <div class="input-group">
                <label for="model-select">Gemini Version (2026 Standard)</label>
                <select id="model-select">
                    <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Standard)</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro (High Reasoning)</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash (Legacy)</option>
                </select>
            </div>
        </section>

        <section class="input-panel">
            <div class="input-row">
                <div class="input-group">
                    <label for="song-title">曲名</label>
                    <input type="text" id="song-title" placeholder="例: KICK BACK" required>
                </div>
                <div class="input-group">
                    <label for="artist-name">アーティスト名</label>
                    <input type="text" id="artist-name" placeholder="例: 米津玄師" required>
                </div>
            </div>
            <button id="analyze-btn" class="primary-btn">分析する ✨</button>
        </section>

        <section id="result-section" class="hidden">
            <div class="result-header">
                <h2>📊 分析レポート</h2>
                <div class="export-buttons">
                    <button onclick="exportReport('text')">Text保存</button>
                    <button onclick="exportReport('md')">Markdown保存</button>
                    <button onclick="exportReport('html')">HTML保存</button>
                </div>
            </div>
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>歌詞を検索し、4つの視点で分析中...<br><span class="note">※正確な分析のため、Web上の情報を確認しています</span></p>
            </div>
            <div id="output-content" class="markdown-body"></div>
            
            <button id="reset-btn" class="secondary-btn">リセットして新しい曲を分析</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
